# Build this checkout instead of pulling upstream application images.
# Run `docker compose build` before `docker compose up -d --no-build`.
services:
  ai-service:
    image: astron-rpa-local/ai-service:local
    pull_policy: never
    build:
      context: ..
      dockerfile: backend/ai-service/Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
        PYPI_FALLBACK_INDEX_URL: ${PYPI_FALLBACK_INDEX_URL:-https://pypi.org/simple}
  openapi-service:
    image: astron-rpa-local/openapi-service:local
    pull_policy: never
    build:
      context: ..
      dockerfile: backend/openapi-service/Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
        PYPI_FALLBACK_INDEX_URL: ${PYPI_FALLBACK_INDEX_URL:-https://pypi.org/simple}
  resource-service:
    image: astron-rpa-local/resource-service:local
    pull_policy: never
    build:
      context: ..
      dockerfile: backend/resource-service/Dockerfile
  robot-service:
    image: astron-rpa-local/robot-service:local
    pull_policy: never
    build:
      context: ..
      dockerfile: backend/robot-service/Dockerfile
  rpa-auth:
    image: astron-rpa-local/rpa-auth:local
    pull_policy: never
    build:
      context: ..
      dockerfile: backend/rpa-auth/Dockerfile
